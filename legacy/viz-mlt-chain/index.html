<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>viz-mlt-chain — one Markov chain walking path space</title>
  <style>
    body { margin: 0; background: #111; color: #eaeaea;
           font: 13px/1.5 ui-sans-serif, system-ui, sans-serif; }
    #bar { padding: 8px 14px; display: flex; gap: 1.5em; align-items: baseline; }
    #bar .hint { color: #888; }
    #info { color: #ffaa33; }
    #layout { display: flex; gap: 2px; }
    #side { display: flex; flex-direction: column; gap: 10px; padding: 8px; width: 220px; }
    #splats { image-rendering: pixelated; width: 204px; height: 204px; background: #000; }
    #side .caption { color: #888; font-size: 12px; }
    #mutation { font-variant-numeric: tabular-nums; }
    #mutation .accept { color: #55cc77; }
    #mutation .reject { color: #dd5555; }
    #mutation .large { color: #77aaff; }
    #viz-pane { position: relative; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="bar">
    <strong>viz-mlt-chain</strong>
    <span id="info">bootstrapping…</span>
    <span class="hint">current path solid · proposal ghosted · accept = ghost solidifies · reject = ghost evaporates</span>
  </div>
  <div id="layout">
    <div id="side">
      <canvas id="splats" width="96" height="96"></canvas>
      <div class="caption">the chain's splats — its footprints on the film</div>
      <div id="mutation">mutation —</div>
      <div class="caption" id="chain-facts"></div>
    </div>
    <div id="viz-pane"></div>
  </div>
  <div id="controls"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
