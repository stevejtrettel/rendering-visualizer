<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>demo</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      /* The stage canvas is absolutely positioned and letterboxed by Stage.resize(). */
      canvas#stage { position: absolute; display: block; }
      a.back {
        position: fixed; top: 10px; left: 12px; z-index: 150;
        color: #3d4750; text-decoration: none;
        font: 12px ui-monospace, Menlo, monospace;
      }
      a.back:hover { color: #d9d1c2; }
      #err {
        position: fixed; inset: 0; display: none; place-content: center;
        color: #b2543a; background: #000; padding: 40px;
        font: 13px/1.6 ui-monospace, Menlo, monospace; white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <a class="back" href="./index.html">← all demos</a>
    <pre id="err"></pre>
    <script type="module" src="/src/demo-host.ts"></script>
  </body>
</html>
