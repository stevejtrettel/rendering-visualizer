<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>viz-convergence — scrub convergence, wipe between integrators</title>
  <style>
    body { margin: 0; background: #111; color: #eaeaea;
           font: 13px/1.5 ui-sans-serif, system-ui, sans-serif; }
    #bar { padding: 8px 14px; display: flex; gap: 1.5em; align-items: baseline; }
    #bar .hint { color: #888; }
    #info { color: #ffaa33; }
    #layout { display: flex; gap: 2px; }
    #side { display: flex; flex-direction: column; gap: 8px; padding: 8px; width: 200px; }
    #side .row { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
    #side select { background: #2a2a2a; color: #eaeaea; border: 1px solid #444;
                   border-radius: 4px; padding: 3px 8px; cursor: pointer; }
    #side .note { color: #888; font-size: 12px; }
    #compare { cursor: ew-resize; display: block; }
  </style>
</head>
<body>
  <div id="bar">
    <strong>viz-convergence</strong>
    <span id="info">rendering…</span>
    <span class="hint">scrub = samples doubling · drag the divider to wipe between integrators</span>
  </div>
  <div id="layout">
    <div id="side">
      <div class="row"><span>compare by</span>
        <select id="mode">
          <option value="sample" selected>equal samples</option>
          <option value="time">equal time</option>
        </select>
      </div>
      <div class="row"><span>view</span>
        <select id="view">
          <option value="image" selected>image</option>
          <option value="error">error (rel. SE)</option>
        </select>
      </div>
      <div class="note">left: unidirectional PT<br>right: PT + NEE (MIS)</div>
      <div class="note">snapshots at 1, 2, 4, … spp as they finish; scrubbing steps through them</div>
    </div>
    <div><canvas id="compare"></canvas></div>
  </div>
  <div id="controls"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
