<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>v1-nee — PT vs PT+NEE, same seed, same samples</title>
  <style>
    body { margin: 0; background: #111; color: #eaeaea;
           font: 13px/1.5 ui-sans-serif, system-ui, sans-serif; }
    #bar { padding: 8px 14px; display: flex; gap: 1.5em; align-items: baseline; }
    #bar .hint { color: #888; }
    #inspect { color: #ffaa33; }
    #panes { display: flex; gap: 2px; }
    #panes > div { position: relative; }
    canvas { display: block; }
    .label { position: absolute; top: 6px; left: 8px; color: #ccc; font-size: 12px;
             text-shadow: 0 1px 2px #000; pointer-events: none; }
    .render-canvas { cursor: crosshair; image-rendering: pixelated; }
  </style>
</head>
<body>
  <div id="bar">
    <strong>v1-nee</strong>
    <span id="status">initializing…</span>
    <span id="inspect"></span>
    <span class="hint">equal samples, equal seeds — click either image to inspect its paths (green: NEE connection, red: blocked)</span>
  </div>
  <div id="panes">
    <div>
      <canvas id="pt-canvas" class="render-canvas"></canvas>
      <div class="label">unidirectional PT</div>
    </div>
    <div>
      <canvas id="nee-canvas" class="render-canvas"></canvas>
      <div class="label">PT + NEE (MIS)</div>
    </div>
    <div id="viz-pane">
      <div class="label">sampled trajectories</div>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
