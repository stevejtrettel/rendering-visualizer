<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>v0-cornell — CPU path tracer + trajectory inspector</title>
  <style>
    body { margin: 0; background: #111; color: #eaeaea;
           font: 13px/1.5 ui-sans-serif, system-ui, sans-serif; }
    #bar { padding: 8px 14px; display: flex; gap: 1.5em; align-items: baseline; }
    #bar .hint { color: #888; }
    #panes { display: flex; gap: 2px; }
    #panes > div { position: relative; }
    canvas { display: block; }
    .label { position: absolute; top: 6px; left: 8px; color: #ccc; font-size: 12px;
             text-shadow: 0 1px 2px #000; pointer-events: none; }
    #render-canvas { cursor: crosshair; image-rendering: pixelated; }
  </style>
</head>
<body>
  <div id="bar">
    <strong>v0-cornell</strong>
    <span id="status">initializing…</span>
    <span id="inspect" style="color:#ffaa33"></span>
    <span class="hint">click a pixel on the left to re-trace and draw its paths on the right</span>
  </div>
  <div id="panes">
    <div>
      <canvas id="render-canvas"></canvas>
      <div class="label">CPU render (unidirectional PT)</div>
    </div>
    <div id="viz-pane">
      <div class="label">three.js — sampled trajectories</div>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
